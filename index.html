<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할일 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 아이콘 모음 (Lucide 스타일 SVG) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/></symbol>    </defs>
  </svg>

  <main class="container">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon"><svg class="icon"><use href="#i-logo"/></svg></span>
        <div>
          <h1>할일 관리</h1>
          <p id="greeting" class="sub"></p>
        </div>
      </div>
      <button id="addBtn" class="btn btn-primary">
        <svg class="icon"><use href="#i-plus"/></svg>
        <span>새로운 할일 추가하기</span>
      </button>
    </header>

    <!-- 1. 오늘 할일 -->
    <section class="section today">
      <div class="section-head">
        <h2><svg class="icon icon-sun"><use href="#i-sun"/></svg>오늘 할일</h2>
        <span id="todayDate" class="chip"></span>
      </div>
      <div class="progress-wrap">
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <span id="progressText" class="progress-text"></span>
      </div>
      <ul id="todayList" class="todo-list"></ul>
    </section>

    <!-- 보기 방식 전환 -->
    <div class="view-toggle" role="tablist">
      <button id="listViewBtn" class="toggle-btn active" role="tab" aria-selected="true">
        <svg class="icon"><use href="#i-list"/></svg>목록으로 보기
      </button>
      <button id="calViewBtn" class="toggle-btn" role="tab" aria-selected="false">
        <svg class="icon"><use href="#i-calendar"/></svg>달력으로 보기
      </button>
    </div>

    <!-- 3. 전체 할일 목록 -->
    <section id="listView" class="section">
      <div class="section-head">
        <h2><svg class="icon"><use href="#i-list"/></svg>할일 목록</h2>
        <span id="allCount" class="chip"></span>
      </div>
      <div class="list-toolbar">
        <div class="filter-group" role="group" aria-label="필터">
          <button class="filter-btn active" data-filter="all">전체 <span class="count" id="countAll"></span></button>
          <button class="filter-btn" data-filter="todo">미완료 <span class="count" id="countTodo"></span></button>
          <button class="filter-btn" data-filter="done">완료 <span class="count" id="countDone"></span></button>
        </div>
        <label class="sort-select">
          <svg class="icon"><use href="#i-sort"/></svg>
          <select id="sortSelect" aria-label="정렬">
            <option value="date">날짜순</option>
            <option value="done">완료순</option>
            <option value="recent">최신등록순</option>
          </select>
        </label>
      </div>
      <ul id="allList" class="todo-list"></ul>
    </section>

    <!-- 달력 보기 -->
    <section id="calendarView" class="section hidden">
      <div class="cal-header">
        <button id="prevMonth" class="btn-icon" aria-label="이전 달"><svg class="icon"><use href="#i-left"/></svg></button>
        <h2 id="calTitle"></h2>
        <button id="nextMonth" class="btn-icon" aria-label="다음 달"><svg class="icon"><use href="#i-right"/></svg></button>
      </div>
      <button id="calTodayBtn" class="link-btn">오늘로 이동</button>
      <div class="cal-grid cal-weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div id="calGrid" class="cal-grid"></div>
    </section>
  </main>

  <!-- 추가/편집 모달 -->
  <div id="formModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h3 id="formTitle">새로운 할일</h3>
        <button class="btn-icon" data-close aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <form id="todoForm">
        <label class="field">
          <span class="field-label"><svg class="icon"><use href="#i-type"/></svg>제목</span>
          <input type="text" id="titleInput" required maxlength="100" placeholder="무엇을 해야 하나요?" />
        </label>
        <label class="field">
          <span class="field-label"><svg class="icon"><use href="#i-text"/></svg>상세 내용</span>
          <textarea id="detailInput" rows="4" placeholder="메모를 남겨보세요 (선택)"></textarea>
        </label>
        <label class="field">
          <span class="field-label"><svg class="icon"><use href="#i-calendar"/></svg>일자</span>
          <input type="date" id="dateInput" required />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" data-close>취소</button>
          <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-save"/></svg>저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 날짜별 할일 모달 (달력에서 날짜 클릭) -->
  <div id="dayModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h3 id="dayTitle" class="day-title"></h3>
        <button class="btn-icon" data-close aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <p id="daySummary" class="sub day-summary"></p>
      <ul id="dayList" class="todo-list day-list"></ul>
      <button id="dayAddBtn" class="btn add-dashed">
        <svg class="icon"><use href="#i-plus"/></svg>이 날짜에 할일 추가
      </button>
    </div>
  </div>

  <!-- 상세 정보 모달 -->
  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-content">
      <div class="modal-head">
        <span id="detailStatus" class="badge"></span>
        <button class="btn-icon" data-close aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <h3 id="detailTitle" class="detail-title"></h3>
      <p class="detail-date"><svg class="icon"><use href="#i-calendar"/></svg><span id="detailDate"></span></p>
      <div class="detail-text-wrap">
        <svg class="icon"><use href="#i-text"/></svg>
        <p id="detailText" class="detail-text"></p>
      </div>
      <div class="modal-actions">
        <button id="editBtn" class="btn"><svg class="icon"><use href="#i-edit"/></svg>편집</button>
        <button id="toggleBtn" class="btn btn-primary"></button>
        <button class="btn btn-ghost" data-close>취소</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
